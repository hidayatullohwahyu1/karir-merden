<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin – Karir Merden</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=20261113e">
  <style>
    .wrap { max-width: 640px; margin: 0 auto; padding: 12px 0 100px; }
    .box { background: var(--card); box-shadow: var(--shadow); padding: 16px; margin-bottom: 10px; }
    @media (min-width: 660px) { .box { border-radius: var(--radius); } }
    .box h2 { margin: 0 0 6px; font-size: 18px; }
    .field { display: block; width: 100%; height: 46px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card); color: var(--text);
      font-size: 16px; padding: 0 12px; margin: 10px 0; }
    .err { background: var(--danger-soft); color: var(--danger); padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
    .new { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; border: 0; border-radius: 10px;
      background: var(--brand); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; }
    .new svg { width: 24px; height: 24px; stroke-width: 2.5; }
    .sub-acts { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
    .sub-acts select { height: 36px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card); color: var(--text); font-size: 14px; padding: 0 8px; }
    .d { position: relative; padding: 0; overflow: hidden; }
    .d img { display: block; width: 100%; max-height: 380px; object-fit: contain; background: var(--bg); }
    .d textarea { display: block; width: 100%; border: 0; resize: none; background: transparent; color: var(--text); font: inherit; font-size: 16px;
      padding: 12px 48px 12px 16px; min-height: 60px; outline: none; }
    .d textarea::placeholder { color: var(--text2); }
    .d .x { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--hover); color: var(--text2);
      font-size: 22px; line-height: 1; cursor: pointer; }
    .d .st { padding: 10px 16px; font-weight: 600; font-size: 14px; border-top: 1px solid var(--line); }
    .st.ok { color: #1a7f37; } .st.err { color: var(--danger); } .st.run { color: var(--brand); }
    .postbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
    .postbar > div { max-width: 640px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
    .postbar .muted { flex: 1; }
    .postbar .btn { width: auto; min-width: 140px; padding: 0 18px; }
    .row { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
    .row:first-of-type { border-top: 0; }
    .row .th { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; background: var(--hover); }
    .row .tx { flex: 1; min-width: 0; }
    .row .tx b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .tx small { color: var(--text2); }
    .ghost { height: 34px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--hover); color: var(--text); font-weight: 600; cursor: pointer; flex: none; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="bar-in">
      <a class="brand" href="./"><img class="logo" src="icons/icon-192.png" alt="" width="36" height="36"><b>karir merden</b></a>
      <button type="button" class="round hidden" id="logout" aria-label="Keluar" title="Keluar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="box" id="vLogin">
      <h2>Masuk admin</h2>
      <p class="muted">Kata sandi diatur di Google Sheets: KARIR MERDEN › Pengaturan › Atur kata sandi admin HP.</p>
      <form id="loginForm" method="post" action="javascript:void(0)" onsubmit="return false" autocomplete="on">
        <input type="text" name="username" value="admin" autocomplete="username" hidden>
        <input class="field" type="password" id="pw" name="password" placeholder="Kata sandi" autocomplete="current-password" required minlength="8">
        <div class="err hidden" id="loginErr" role="alert"></div>
        <button class="btn" type="submit" id="loginBtn">Masuk</button>
      </form>
    </section>

    <section id="vApp" class="hidden">
      <div class="box">
        <button type="button" class="new" id="newBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Posting flyer
        </button>
        <div class="sub-acts">
          <label class="muted">Daerah
            <select id="kab"><option value="">Semua daerah</option></select></label>
          <button type="button" class="link" id="textBtn">Tanpa foto</button>
        </div>
        <input type="file" id="files" accept="image/jpeg,image/png,image/webp" multiple hidden>
      </div>

      <div id="drafts"></div>

      <div class="box">
        <h2>Sedang tayang</h2>
        <div id="recent"><p class="muted">Memuat…</p></div>
      </div>
    </section>
  </main>

  <div class="postbar hidden" id="postbar"><div>
    <span class="muted" id="postInfo"></span>
    <button type="button" class="btn" id="goBtn" disabled>Posting</button>
  </div></div>

  <div class="toast hidden" id="toast" role="status"></div>

  <script src="config.js?v=20261113e"></script>
  <script src="pwa.js?v=20261113e"></script>
  <script src="admin.js?v=20261113e"></script>
</body>
</html>
